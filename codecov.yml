codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "30...80"
  status:
    project:
      default:
        target: auto
        threshold: 2%
        if_ci_failed: error
    patch:
      default:
        target: 70%
        threshold: 5%
        if_ci_failed: error

github_checks:
  annotations: true

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: true

ignore:
  - "coverage/**"
  - "dist/**"
  - "docs/**"
  - "resources/**"
  - "schema/**"
  - "test/**"
  - "src/**/__tests__/**"
  - "src/**/*.d.ts"
